<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fridge</title>
  <meta name="description" content="Track the food in your fridge, freezer and pantry so you use it before it goes bad.">

  <!-- PWA / installability -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f4f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon.png" type="image/png" sizes="512x512">

  <!-- iPhone Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fridge">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="viewTitle">Fridge</h1>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="home" class="tab">
      <span class="tab-icon">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span class="badge" id="homeBadge" hidden></span>
      </span>
      <span class="tab-label">Home</span>
    </button>
    <button data-tab="cook" class="tab">
      <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v2a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7z"/><path d="M2 11h20"/><path d="M9 7c0-1 1-1.5 1-2.5S9 3 9 3M14 7c0-1 1-1.5 1-2.5S14 3 14 3"/></svg></span>
      <span class="tab-label">Cook</span>
    </button>
    <button data-tab="add" class="tab tab-add" aria-label="Add">
      <span class="add-circle"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="tab-label">Add</span>
    </button>
    <button data-tab="shop" class="tab">
      <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.2a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/></svg></span>
      <span class="tab-label">List</span>
    </button>
    <button data-tab="money" class="tab">
      <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.6a4.2 4.2 0 1 0 0 6.8M7.5 10.8h5.5M7.5 13.2h5.5"/></svg></span>
      <span class="tab-label">Money</span>
    </button>
    <button data-tab="more" class="tab">
      <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></span>
      <span class="tab-label">More</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <noscript><p style="padding:1rem">Fridge needs JavaScript turned on.</p></noscript>
  <script>
    /* If the app can't start (for example when an update was only half
       downloaded and the offline copy mixes old and new files), repair it:
       delete the offline copy of the app's files, fetch them fresh, reload.
       Your food, list and settings are never touched. It's tried once by
       itself; if the app still can't start, a button offers it again. */
    (function () {
      var started = false;
      var el = (navigator.language || '').toLowerCase().indexOf('el') === 0;
      window.fridgeStarted = function () { started = true; };
      window.fridgeRepair = function () {
        var reload = function () { location.reload(); };
        var jobs = [];
        if (window.caches) jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (k) { return k.indexOf('fridge-app-') === 0; }).map(function (k) { return caches.delete(k); }));
        }));
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }));
        Promise.all(jobs).then(function () {
          // Refresh the browser's own copy of every file this page loaded.
          var urls = [location.href.split('#')[0]].concat((performance.getEntriesByType ? performance.getEntriesByType('resource') : [])
            .map(function (e) { return e.name; })
            .filter(function (u) { return u.indexOf(location.origin + '/') === 0; }));
          return Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); }));
        }).then(reload, reload);
      };
      window.fridgeOfferRepair = function () {
        if (started || document.getElementById('repair')) return;
        var last = Date.now();
        try { last = +localStorage.getItem('fridge-repaired') || 0; localStorage.setItem('fridge-repaired', String(Date.now())); } catch (e) { /* no storage: ask */ }
        if (Date.now() - last > 60000) { window.fridgeRepair(); return; }
        var box = document.createElement('div');
        box.id = 'repair';
        box.className = 'repair';
        box.innerHTML = '<p>' + (el
          ? 'Το Fridge δεν μπόρεσε να ξεκινήσει. Μπορεί να συμβεί μετά από μια ενημέρωση. Τα τρόφιμα και οι ρυθμίσεις σας δεν χάνονται.'
          : 'Fridge couldn’t start. This can happen after an update. Your food and settings are safe.') +
          '</p><button class="btn primary big" type="button" onclick="fridgeRepair()">' + (el ? 'Επιδιόρθωση και φόρτωση ξανά' : 'Repair and reload') + '</button>';
        document.body.appendChild(box);
      };
      window.addEventListener('error', function () { if (!started) setTimeout(window.fridgeOfferRepair, 1500); });
      setTimeout(window.fridgeOfferRepair, 10000);
    })();
  </script>
  <script type="module" src="js/app.js" onerror="fridgeOfferRepair()"></script>
</body>
</html>
